<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="melqartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="melqartGradSolid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Outer main loop track -->
    <path d="M 120 140 
             L 300 140 
             C 415 140, 475 210, 475 300 
             C 475 390, 390 470, 290 470 
             C 190 470, 105 390, 45 300 
             C 10 240, 50 170, 100 170 
             Z" 
          fill="none" 
          stroke="url(#melqartGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowEffect)" />

    <!-- Top-Left diagonal slice cut -->
    <line x1="110" y1="115" x2="175" y2="235" stroke="#07080f" stroke-width="42" stroke-linecap="round" />

    <!-- Inner parallel loop -->
    <path d="M 180 220 
             L 280 220 
             C 350 220, 395 255, 395 305 
             C 395 355, 350 395, 275 395 
             C 200 395, 145 355, 110 300 
             C 85 260, 120 230, 160 230" 
          fill="none" 
          stroke="url(#melqartGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95" />

    <!-- Top-Left inner diagonal slice cut -->
    <line x1="145" y1="195" x2="195" y2="275" stroke="#07080f" stroke-width="32" stroke-linecap="round" />

    <!-- Center dot -->
    <circle cx="295" cy="305" r="28" fill="url(#melqartGrad)" filter="url(#glowEffect)" />
  </g>
</svg>
