<aside
      (mouseenter)="hovered.set(true)"
      (mouseleave)="hovered.set(false)"
      [class]="'h-screen flex flex-col fixed left-0 top-0 z-40 sidebar-bg '
        + 'transition-[width,box-shadow] duration-250 ease-[cubic-bezier(0.16,1,0.3,1)] '
        + (isExpanded() ? 'w-64' : 'w-[68px]')"
      [style.box-shadow]="isExpanded()
        ? '4px 0 40px -4px hsl(var(--sidebar-primary)/0.18), 2px 0 8px -2px rgba(0,0,0,0.12)'
        : '2px 0 8px -2px rgba(0,0,0,0.06)'"
    >

      <!-- Logo + Pin button -->
      <div class="h-14 flex items-center shrink-0 border-b overflow-hidden"
           style="border-color: hsl(var(--sidebar-border))"
           [class.px-4]="isExpanded()" [class.justify-between]="isExpanded()"
           [class.justify-center]="!isExpanded()" [class.px-0]="!isExpanded()">

        <div class="logo-icon h-10 flex items-center justify-center shrink-0">
          <img src="1000044998.png" alt="Logo" class="max-w-[180px] h-full object-contain dark:invert" />
        </div>

        <div *ngIf="isExpanded()" class="flex items-center justify-end flex-1 ml-3 min-w-0 overflow-hidden">
          <button
            (click)="togglePin(); $event.stopPropagation()"
            class="w-6 h-6 rounded-lg flex items-center justify-center shrink-0 transition-all duration-200 ml-2"
            [style.background]="pinned() ? 'hsl(var(--sidebar-primary)/0.15)' : 'transparent'"
            [style.color]="pinned() ? 'hsl(var(--sidebar-primary))' : 'hsl(var(--sidebar-foreground)/0.4)'"
            [title]="pinned() ? 'Désépingler' : 'Épingler ouvert'"
          >
            <svg *ngIf="pinned()" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L8 8H4l4 6v6l4-3 4 3v-6l4-6h-4L12 2z"/>
            </svg>
            <svg *ngIf="!pinned()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="17" x2="12" y2="22"/>
              <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Role label -->
      <div *ngIf="isExpanded()" class="px-4 pt-4 pb-1 shrink-0 overflow-hidden">
        <p class="sidebar-label text-[9px] font-bold uppercase tracking-[0.20em] opacity-40 mb-0"
           [class.sidebar-label-visible]="isExpanded()"
           [class.sidebar-label-hidden]="!isExpanded()"
           style="color: hsl(var(--sidebar-foreground))">
          {{ roleTitle() }}
        </p>
      </div>

      <!-- ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ 
           NAVIGATION — Ordered Items & Accordions
      ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═ ═  -->
      <nav class="flex-1 overflow-y-auto overflow-x-hidden pb-4 pt-2 space-y-0.5"
           [class.px-3]="isExpanded()" [class.px-1.5]="!isExpanded()">

        <!-- 1. Flat top-level items (e.g. Tableau de bord, Production) -->
        <ng-container *ngFor="let item of topItems()">
          <a [routerLink]="item.path"
             routerLinkActive="sidebar-item-active nav-link-active"
             [routerLinkActiveOptions]="{exact: false}"
             class="nav-link group flex items-center rounded-xl text-sm font-medium transition-all duration-200 cursor-pointer py-2.5"
             [class.gap-3]="isExpanded()" [class.px-3]="isExpanded()"
             [class.justify-center]="!isExpanded()" [class.px-0]="!isExpanded()"
             style="color: hsl(var(--sidebar-foreground) / 0.65)"
             [title]="!isExpanded() ? item.title : ''">
            <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: item.icon }"></ng-container>
            <span *ngIf="isExpanded()"
                  class="sidebar-label flex-1 truncate group-hover:translate-x-0.5 transition-transform duration-200"
                  [class.sidebar-label-visible]="isExpanded()"
                  [class.sidebar-label-hidden]="!isExpanded()">
              {{ item.title }}
            </span>
          </a>
        </ng-container>

        <!-- 2. Accordion group: Gestion des comptes -->
        <ng-container *ngIf="accountGroup() as group">
          <!-- Group header (clickable accordion toggle) -->
          <div *ngIf="isExpanded()"
               (click)="toggleGroup()"
               class="group-header relative flex items-center gap-3 px-3 py-2 rounded-xl cursor-pointer"
               [style.color]="isGroupActive() ? 'hsl(var(--sidebar-primary))' : 'hsl(var(--sidebar-foreground) / 0.45)'">
            <!-- Active bar (left glow) -->
            <div *ngIf="isGroupActive() && !groupOpen()" class="group-active-bar"></div>

            <!-- Group icon -->
            <span class="nav-icon w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
                  [style.background]="isGroupActive()
                    ? 'hsl(var(--sidebar-primary) / 0.15)'
                    : 'hsl(var(--sidebar-accent) / 0.4)'">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/>
              </svg>
            </span>

            <!-- Group label -->
            <span class="sidebar-label flex-1 text-[11px] font-bold uppercase tracking-[0.12em]"
                  [class.sidebar-label-visible]="isExpanded()"
                  [class.sidebar-label-hidden]="!isExpanded()">
              {{ group.label }}
            </span>

            <!-- Chevron -->
            <svg class="group-chevron w-3.5 h-3.5 shrink-0" [class.group-chevron-open]="groupOpen()"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>

          <!-- Accordion body — children items -->
          <div class="group-children"
               [class.group-children-open]="groupOpen() || !isExpanded()"
               [class.group-children-closed]="!groupOpen() && isExpanded()">
            <div [class.pl-3]="isExpanded()" class="space-y-0.5" [class.pt-0.5]="isExpanded()">
              <a *ngFor="let child of group.children"
                 [routerLink]="child.path"
                 routerLinkActive="sidebar-item-active nav-link-active"
                 [routerLinkActiveOptions]="{exact: false}"
                 class="nav-link group flex items-center rounded-xl text-sm font-medium transition-all duration-200 cursor-pointer py-2"
                 [class.gap-3]="isExpanded()" [class.px-3]="isExpanded()"
                 [class.justify-center]="!isExpanded()" [class.px-0]="!isExpanded()"
                 [class.py-2.5]="!isExpanded()"
                 style="color: hsl(var(--sidebar-foreground) / 0.6)"
                 [title]="!isExpanded() ? child.title : ''">
                <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: child.icon }"></ng-container>
                <span *ngIf="isExpanded()"
                      class="sidebar-label flex-1 truncate text-[13px] group-hover:translate-x-0.5 transition-transform duration-200"
                      [class.sidebar-label-visible]="isExpanded()"
                      [class.sidebar-label-hidden]="!isExpanded()">
                  {{ child.title }}
                </span>
              </a>
            </div>
          </div>
        </ng-container>

        <!-- 3. Accordion group: Utilisateurs externes & organisations -->
        <ng-container *ngIf="usersGroup() as group">
          <div *ngIf="isExpanded()"
               (click)="toggleUsersGroup()"
               class="group-header relative flex items-center gap-3 px-3 py-2 rounded-xl cursor-pointer"
               [style.color]="isUsersGroupActive() ? 'hsl(var(--sidebar-primary))' : 'hsl(var(--sidebar-foreground) / 0.45)'">
            <div *ngIf="isUsersGroupActive() && !usersGroupOpen()" class="group-active-bar"></div>

            <span class="nav-icon w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
                  [style.background]="isUsersGroupActive()
                    ? 'hsl(var(--sidebar-primary) / 0.15)'
                    : 'hsl(var(--sidebar-accent) / 0.4)'">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="13" height="18" rx="1"/>
                <path d="M16 8h5l1 14H16"/><line x1="7" y1="7" x2="10" y2="7"/>
                <line x1="7" y1="11" x2="10" y2="11"/><line x1="7" y1="15" x2="10" y2="15"/>
              </svg>
            </span>

            <span class="sidebar-label flex-1 text-[11px] font-bold uppercase tracking-[0.12em]"
                  [class.sidebar-label-visible]="isExpanded()"
                  [class.sidebar-label-hidden]="!isExpanded()">
              {{ group.label }}
            </span>

            <svg class="group-chevron w-3.5 h-3.5 shrink-0" [class.group-chevron-open]="usersGroupOpen()"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>

          <div class="group-children"
               [class.group-children-open]="usersGroupOpen() || !isExpanded()"
               [class.group-children-closed]="!usersGroupOpen() && isExpanded()">
            <div [class.pl-3]="isExpanded()" class="space-y-0.5" [class.pt-0.5]="isExpanded()">
              <a *ngFor="let child of group.children"
                 [routerLink]="child.path"
                 routerLinkActive="sidebar-item-active nav-link-active"
                 [routerLinkActiveOptions]="{exact: true}"
                 class="nav-link group flex items-center rounded-xl text-sm font-medium transition-all duration-200 cursor-pointer py-2"
                 [class.gap-3]="isExpanded()" [class.px-3]="isExpanded()"
                 [class.justify-center]="!isExpanded()" [class.px-0]="!isExpanded()"
                 [class.py-2.5]="!isExpanded()"
                 style="color: hsl(var(--sidebar-foreground) / 0.6)"
                 [title]="!isExpanded() ? child.title : ''">
                <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: child.icon }"></ng-container>
                <span *ngIf="isExpanded()"
                      class="sidebar-label flex-1 truncate text-[13px] group-hover:translate-x-0.5 transition-transform duration-200"
                      [class.sidebar-label-visible]="isExpanded()"
                      [class.sidebar-label-hidden]="!isExpanded()">
                  {{ child.title }}
                </span>
              </a>
            </div>
          </div>
        </ng-container>

        <!-- 4. Accordion group: Gestion de Stock (ADMIN & APPRO) -->
        <ng-container *ngIf="stockItems().length > 0">
          <!-- Group header (clickable accordion toggle) -->
          <div *ngIf="isExpanded()"
               (click)="toggleStockGroup()"
               class="group-header relative flex items-center gap-3 px-3 py-2 rounded-xl cursor-pointer"
               [style.color]="isStockGroupActive() ? 'hsl(var(--sidebar-primary))' : 'hsl(var(--sidebar-foreground) / 0.45)'">
            <!-- Active bar (left glow) -->
            <div *ngIf="isStockGroupActive() && !stockGroupOpen()" class="group-active-bar"></div>

            <!-- Group icon -->
            <span class="nav-icon w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
                  [style.background]="isStockGroupActive()
                    ? 'hsl(var(--sidebar-primary) / 0.15)'
                    : 'hsl(var(--sidebar-accent) / 0.4)'">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
            </span>

            <!-- Group label -->
            <span class="sidebar-label flex-1 text-[11px] font-bold uppercase tracking-[0.12em]"
                  [class.sidebar-label-visible]="isExpanded()"
                  [class.sidebar-label-hidden]="!isExpanded()">
              Gestion de Stock
            </span>

            <!-- Chevron -->
            <svg class="group-chevron w-3.5 h-3.5 shrink-0" [class.group-chevron-open]="stockGroupOpen()"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>

          <!-- Accordion body — children items -->
          <div class="group-children"
               [class.group-children-open]="stockGroupOpen() || !isExpanded()"
               [class.group-children-closed]="!stockGroupOpen() && isExpanded()">
            <div [class.pl-3]="isExpanded()" class="space-y-0.5" [class.pt-0.5]="isExpanded()">
              <a *ngFor="let item of stockItems()"
                 [routerLink]="item.path"
                 routerLinkActive="sidebar-item-active nav-link-active"
                 [routerLinkActiveOptions]="{exact: item.path === '/stock'}"
                 class="nav-link group flex items-center rounded-xl text-sm font-medium transition-all duration-200 cursor-pointer py-2"
                 [class.gap-3]="isExpanded()" [class.px-3]="isExpanded()"
                 [class.justify-center]="!isExpanded()" [class.px-0]="!isExpanded()"
                 [class.py-2.5]="!isExpanded()"
                 style="color: hsl(var(--sidebar-foreground) / 0.6)"
                 [title]="!isExpanded() ? item.title : ''">
                <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: item.icon }"></ng-container>
                <span *ngIf="isExpanded()"
                      class="sidebar-label flex-1 truncate text-[13px] group-hover:translate-x-0.5 transition-transform duration-200"
                      [class.sidebar-label-visible]="isExpanded()"
                      [class.sidebar-label-hidden]="!isExpanded()">
                  {{ item.title }}
                </span>
              </a>
            </div>
          </div>
        </ng-container>

        <!-- 5. Flat bottom items (Workspace Projets, Catalogue, Devis, Factures, Paiements, Livraison) -->
        <ng-container *ngFor="let item of bottomItems()">
          <a [routerLink]="item.path"
             routerLinkActive="sidebar-item-active nav-link-active"
             [routerLinkActiveOptions]="{exact: false}"
             class="nav-link group flex items-center rounded-xl text-sm font-medium transition-all duration-200 cursor-pointer py-2.5"
             [class.gap-3]="isExpanded()" [class.px-3]="isExpanded()"
             [class.justify-center]="!isExpanded()" [class.px-0]="!isExpanded()"
             style="color: hsl(var(--sidebar-foreground) / 0.65)"
             [title]="!isExpanded() ? item.title : ''">
            <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: item.icon }"></ng-container>
            <span *ngIf="isExpanded()"
                  class="sidebar-label flex-1 truncate group-hover:translate-x-0.5 transition-transform duration-200"
                  [class.sidebar-label-visible]="isExpanded()"
                  [class.sidebar-label-hidden]="!isExpanded()">
              {{ item.title }}
            </span>
          </a>
        </ng-container>
      </nav>

      <!-- Bottom: Profile -->
      <div class="shrink-0 border-t pb-2 pt-2 flex flex-col gap-1 overflow-hidden"
           style="border-color: hsl(var(--sidebar-border))"
           [class.px-3]="isExpanded()" [class.px-1.5]="!isExpanded()">

        <a routerLink="/profile/edit"
           routerLinkActive="sidebar-item-active nav-link-active"
           class="nav-link group flex items-center rounded-xl text-sm font-medium transition-all duration-200 py-2.5"
           [class.gap-3]="isExpanded()" [class.px-3]="isExpanded()" [class.justify-center]="!isExpanded()"
           style="color: hsl(var(--sidebar-foreground) / 0.55)"
           [title]="!isExpanded() ? 'Mon Profil' : ''">
          <span class="nav-icon w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
                style="background: hsl(var(--sidebar-accent) / 0.5)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <span *ngIf="isExpanded()"
                class="sidebar-label"
                [class.sidebar-label-visible]="isExpanded()"
                [class.sidebar-label-hidden]="!isExpanded()">Mon Profil</span>
        </a>

      </div>
    </aside>

    <!-- Shared icon template -->
    <ng-template #iconTpl let-icon>
      <span class="nav-icon w-8 h-8 rounded-lg flex items-center justify-center shrink-0 transition-all duration-200"
            style="background: hsl(var(--sidebar-accent) / 0.6)">
        <!-- Dashboard -->
        <svg *ngIf="icon === 'dashboard'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <!-- Users -->
        <svg *ngIf="icon === 'users'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/>
        </svg>
        <!-- Star (Avis clients) -->
        <svg *ngIf="icon === 'star'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <!-- Layers -->
        <svg *ngIf="icon === 'layers'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
        </svg>
        <!-- File text -->
        <svg *ngIf="icon === 'file-text'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <!-- Plus-circle -->
        <svg *ngIf="icon === 'plus-circle'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        <!-- Shopping cart -->
        <svg *ngIf="icon === 'shopping-cart'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <!-- Truck -->
        <svg *ngIf="icon === 'truck'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13" rx="1"/>
          <path d="M16 8h4l3 6v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
        <!-- Building -->
        <svg *ngIf="icon === 'building'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="13" height="18" rx="1"/>
          <path d="M16 8h5l1 14H16"/><line x1="7" y1="7" x2="10" y2="7"/>
          <line x1="7" y1="11" x2="10" y2="11"/><line x1="7" y1="15" x2="10" y2="15"/>
        </svg>
        <!-- Dollar -->
        <svg *ngIf="icon === 'dollar'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <!-- Message-circle -->
        <svg *ngIf="icon === 'message-circle'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <!-- Headphones -->
        <svg *ngIf="icon === 'headphones'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/>
          <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
        </svg>
        <!-- Check-circle -->
        <svg *ngIf="icon === 'check-circle'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="9 12 11.5 14.5 15 10"/>
        </svg>
        <!-- Activity -->
