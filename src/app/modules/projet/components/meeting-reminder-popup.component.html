<!-- Top-Right Fixed Floating Widget (Chef de Projet Uniquement) -->
    <div *ngIf="isChefDeProjet && upcomingReunion"
         class="fixed top-20 right-6 z-[9999] transition-all duration-500 ease-out animate-slideIn">

      <!-- ══════════════════════════════════════════════════════ -->
      <!-- ÉTAT 1 : POPUP COMPLET (COMPTE À REBOURS AVANT RÉUNION) -->
      <!-- ══════════════════════════════════════════════════════ -->
      <div *ngIf="!isMinimized"
           class="relative w-84 sm:w-96 rounded-3xl p-4 sm:p-5 shadow-[0_20px_50px_rgba(0,0,0,0.25)] border transition-all duration-300 overflow-hidden bg-white/98 dark:bg-slate-900/98 text-slate-900 dark:text-white border-blue-500/40 dark:border-blue-500/30 backdrop-blur-2xl shadow-xl">

        <!-- Top Glowing Bar -->
        <div class="absolute top-0 left-0 right-0 h-1"
             style="background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981)"></div>

        <!-- Header Row -->
        <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-100 dark:border-slate-800">
          
          <!-- Status Indicator -->
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span>
            <span class="text-[11px] font-black uppercase tracking-wider text-blue-600 dark:text-blue-400">
              ⏱️ Rappel Réunion Imminente
            </span>
          </div>

          <!-- Controls (Mute / Minimize / Close) -->
          <div class="flex items-center gap-1.5">
            <!-- Mute Button -->
            <button (click)="toggleMute()"
                    class="w-6 h-6 rounded-lg flex items-center justify-center text-xs opacity-60 hover:opacity-100 hover:bg-slate-200 dark:hover:bg-slate-800 transition-all cursor-pointer"
                    [title]="isMuted ? 'Activer le son' : 'Couper le son'">
              {{ isMuted ? '🔇' : '🔔' }}
            </button>
            <!-- Minimize Button -->
            <button (click)="minimize()"
                    class="w-6 h-6 rounded-lg flex items-center justify-center text-xs opacity-60 hover:opacity-100 hover:bg-slate-200 dark:hover:bg-slate-800 transition-all cursor-pointer"
                    title="Réduire en bulle flottante">
              ➖
            </button>
            <!-- Dismiss Button -->
            <button (click)="dismiss()"
                    class="w-6 h-6 rounded-lg flex items-center justify-center text-xs opacity-60 hover:opacity-100 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-all cursor-pointer"
                    title="Fermer ce rappel">
              ✕
            </button>
          </div>
        </div>

        <!-- Meeting Info Body -->
        <div class="space-y-2 mb-3.5">
          <div class="flex items-start justify-between gap-2">
            <h4 class="text-xs sm:text-sm font-black truncate flex-1" style="font-family:'Outfit',sans-serif">
              {{ upcomingReunion.titre || 'Point technique client' }}
            </h4>
          </div>

          <div class="flex items-center gap-3 text-[11px] opacity-80 flex-wrap">
            <span class="font-bold">📁 {{ upcomingReunion.projetNom }}</span>
            <span>•</span>
            <span class="font-bold">🏢 {{ upcomingReunion.clientNom }}</span>
          </div>

          <!-- Countdown Box -->
          <div class="p-2.5 rounded-2xl flex items-center justify-between border bg-blue-50/80 dark:bg-slate-800/70 border-blue-100 dark:border-slate-700/60 text-blue-900 dark:text-blue-200">
            <div class="flex items-center gap-2">
              <span class="text-base">⏳</span>
              <span class="text-xs font-semibold">Début dans :</span>
            </div>

            <!-- Big Countdown Digits -->
            <div class="font-mono text-sm sm:text-base font-black tracking-tight text-blue-600 dark:text-blue-400">
              {{ countdownFormatted }}
            </div>
          </div>
        </div>

        <!-- Mode Compte à Rebours (< 30 min) -->
        <button (click)="joinMeeting()"
                class="w-full py-2.5 px-4 rounded-2xl text-xs font-black text-white flex items-center justify-center gap-2 transition-all shadow-md hover:opacity-95 active:scale-[0.98] cursor-pointer"
                style="background: linear-gradient(135deg, #3b82f6 0%, #0284c7 100%);">
          <span>🎥</span>
          <span>Préparer &amp; Ouvrir Google Meet ↗</span>
        </button>

      </div>

      <!-- ══════════════════════════════════════════════════════ -->
      <!-- ÉTAT 2 : BULLE FLOTTANTE RÉDUITE AVEC COMPTE À REBOURS  -->
      <!-- ══════════════════════════════════════════════════════ -->
      <div *ngIf="isMinimized"
           (click)="maximize()"
           class="flex items-center gap-2.5 py-2.5 px-4 rounded-full shadow-2xl border cursor-pointer transition-all hover:scale-105 active:scale-95 animate-bounce-subtle bg-white dark:bg-slate-900 text-slate-900 dark:text-white border-blue-500/50 shadow-blue-500/10">
        <span class="text-base">⏳</span>
        <div class="text-xs font-black flex items-center gap-1.5 font-mono">
          <span>{{ countdownFormatted }}</span>
        </div>
      </div>

    </div>
