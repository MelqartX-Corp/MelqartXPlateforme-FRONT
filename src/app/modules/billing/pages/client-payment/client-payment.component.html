<div class="min-h-[80vh] flex items-center justify-center p-4 sm:p-6 animate-fade-up">
      <div class="relative overflow-hidden bg-white/95 dark:bg-gray-800/95 backdrop-blur-xl max-w-lg w-full p-8 sm:p-10 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700/80 text-center space-y-6">
        
        <!-- Ambient Decorative Glow -->
        <div class="absolute -right-10 -top-10 w-48 h-48 bg-blue-500/10 dark:bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -left-10 -bottom-10 w-48 h-48 bg-indigo-500/10 dark:bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Secure Shield Icon -->
        <div class="relative w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-3xl flex items-center justify-center mx-auto shadow-xl shadow-blue-500/25">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
        </div>

        <div class="space-y-2">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 text-xs font-bold uppercase tracking-wider">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Règlement sécurisé
          </div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Règlement en Ligne</h1>
          <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 max-w-sm mx-auto leading-relaxed">
            Confirmez le règlement de votre facture. Le montant est arrêté par nos serveurs sur la facture elle-même — vous n'avez rien à saisir.
          </p>
        </div>

        <!-- Security Features Banner -->
        <div class="p-4 rounded-2xl bg-gray-50 dark:bg-gray-900/50 border border-gray-100 dark:border-gray-700/60 grid grid-cols-2 gap-3 text-left text-xs">
          <div class="flex items-center gap-2 text-gray-700 dark:text-gray-300">
            <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            <span class="font-bold">Cryptage SSL 256-bit</span>
          </div>
          <div class="flex items-center gap-2 text-gray-700 dark:text-gray-300">
            <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            <span class="font-bold">Validation Immédiate</span>
          </div>
        </div>

        <!-- Action CTA -->
        <div class="space-y-3 pt-2">
          <button 
            (click)="pay()" 
            [disabled]="paying" 
            class="w-full py-3.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold text-sm rounded-2xl shadow-xl shadow-blue-500/25 hover:shadow-2xl hover:shadow-blue-500/30 transition-all active:scale-98 disabled:opacity-50 flex items-center justify-center gap-2.5 cursor-pointer">
            <span *ngIf="paying" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            <svg *ngIf="!paying" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span>{{ paying ? 'Règlement en cours...' : 'Confirmer le règlement' }}</span>
          </button>

          <p *ngIf="erreur" class="text-xs font-bold text-red-600 dark:text-red-400 m-0">{{ erreur }}</p>

          <a routerLink="/client/billing/invoices" class="inline-block text-xs font-bold text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition py-1">
            ← Revenir à mes Factures
          </a>
        </div>

      </div>
    </div>
