<div class="min-h-screen bg-background flex items-center justify-center p-4">
  <div class="text-center">
    <!-- Logo -->
    <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-xl mb-6">
      <span class="text-primary-foreground font-bold text-2xl">M</span>
    </div>

    <!-- 404 -->
    <div class="mb-6">
      <h1 class="text-9xl font-bold text-primary mb-2">404</h1>
      <h2 class="text-2xl text-foreground mb-2">Page non trouvée</h2>
      <p class="text-muted-foreground max-w-md mx-auto">
        Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
      </p>
    </div>

    <!-- Actions -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button (click)="goBack()" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-10 px-4 py-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 mr-2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Retour
      </button>
      <button (click)="goHome()" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2  btn-primary  h-10 px-4 py-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 mr-2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Accueil
      </button>
    </div>
  </div>
</div>
