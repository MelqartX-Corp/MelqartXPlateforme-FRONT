<div class="space-y-6 animate-fade-up">

  <!-- ═══ PREMIUM PAGE HEADER ═══ -->
  <div class="page-header-premium">
    <div class="relative z-10 space-y-1.5">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🏢</span>
        <h1 class="page-title-premium">
          Organisations & Entreprises
        </h1>
      </div>
      <p class="text-xs text-muted-foreground font-semibold">
        Gérez les comptes entreprises clientes, leurs structures et leurs équipes
      </p>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
    <div *ngFor="let org of organisations"
         class="glass-card rounded-2xl p-6 hover:-translate-y-1 cursor-pointer group transition-all duration-200">

      <!-- Top row -->
      <div class="flex items-start gap-4 mb-4">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 shadow-sm"
             style="background: hsl(var(--accent) / 0.12)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               style="color: hsl(var(--accent))">
            <rect x="3" y="3" width="13" height="18" rx="1"/>
            <path d="M16 8h5l1 14H16"/>
            <line x1="7" y1="7" x2="10" y2="7"/>
            <line x1="7" y1="11" x2="10" y2="11"/>
            <line x1="7" y1="15" x2="10" y2="15"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="font-semibold text-foreground truncate">{{org.raisonSociale}}</h3>
          <p class="text-xs text-muted-foreground mt-0.5">MF: {{org.matriculeFiscale}}</p>
        </div>
        <span class="badge-success shrink-0">Actif</span>
      </div>

      <!-- Details -->
      <div class="space-y-2 text-sm mb-5">
        <div class="flex items-center gap-2 text-muted-foreground">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          <span class="truncate">{{org.adresse}}</span>
        </div>
        <div class="flex items-center gap-2 text-muted-foreground">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="truncate">{{org.userAssocie}}</span>
        </div>
      </div>

      <!-- Stats row -->
      <div class="flex items-center justify-between p-3 bg-secondary/40 rounded-xl mb-4">
        <div class="text-center">
          <p class="text-lg font-bold" style="color:hsl(var(--primary))">{{org.nbCommandes}}</p>
          <p class="text-[10px] text-muted-foreground uppercase tracking-wide">Commandes</p>
        </div>
        <div class="h-8 w-px bg-border/50"></div>
        <div class="text-center">
          <p class="text-xs text-muted-foreground">Créé le</p>
          <p class="text-sm font-medium text-foreground">{{org.dateCreation}}</p>
        </div>
      </div>

      <!-- Action -->
      <button class="btn-secondary w-full gap-2 text-xs">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        Voir les détails
      </button>
    </div>
  </div>

</div>
