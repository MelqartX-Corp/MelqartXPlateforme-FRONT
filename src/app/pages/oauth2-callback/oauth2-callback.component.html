<div class="min-h-screen flex items-center justify-center bg-canvas p-6 relative overflow-hidden">
      <!-- Ambient orbs -->
      <div class="absolute top-[15%] left-[10%] w-[500px] h-[500px] rounded-full blur-[120px] opacity-20 pointer-events-none" style="background: hsl(var(--primary))"></div>

      <div class="w-full max-w-md animate-fade-up relative z-10 text-center">
        <!-- Loading state -->
        <div *ngIf="loading" class="space-y-4">
          <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p class="text-muted-foreground font-medium animate-pulse">Connexion avec Google en cours...</p>
        </div>

        <!-- Error state -->
        <div *ngIf="!loading && errorMessage" class="glass-card rounded-3xl p-8 space-y-5">
          <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center" style="background: hsl(var(--destructive)/0.15)">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color: hsl(var(--destructive))">
              <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
          </div>
          <h2 class="text-xl font-bold text-foreground">Erreur de connexion</h2>
          <p class="text-sm text-muted-foreground">{{ errorMessage }}</p>
          <a routerLink="/login" class="btn-primary w-full justify-center h-11 text-sm mt-4 inline-flex items-center">
            Retour à la connexion
          </a>
        </div>
      </div>
    </div>
