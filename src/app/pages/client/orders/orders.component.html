<div class="space-y-8 animate-fade-up">

  <!-- ═══ CLIENT "WOW" HERO HEADER ═══ -->
  <div class="client-header-hero">
    <div class="relative z-10 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-5">
      <div class="client-header-icon-box">
        📦
      </div>
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="client-header-tag">
            <span class="client-header-tag-dot"></span>
            Espace Commandes
          </span>
        </div>
        <h1 class="client-header-title">
          Mes commandes
        </h1>
        <p class="text-xs text-muted-foreground font-medium">
          Suivez l'état de fabrication, d'assemblage et de livraison de vos commandes.
        </p>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="glass-card rounded-2xl p-4 flex flex-wrap items-center gap-4">
    <div class="flex items-center gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase tracking-wide">Statut</label>
      <select class="input-base w-40">
        <option value="all">Tous</option>
        <option value="FABRICATION">En fabrication</option>
        <option value="ASSEMBLAGE">En assemblage</option>
        <option value="EXPEDIEE">Expédiée</option>
        <option value="LIVREE">Livrée</option>
      </select>
    </div>
    <div class="flex items-center gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase tracking-wide">Recherche</label>
      <input type="text" class="input-base w-48" placeholder="Ex: CMD-2024..."/>
    </div>
    <span class="ml-auto badge-muted">{{orders.length}} résultat(s)</span>
  </div>

  <!-- Orders Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
    <div *ngFor="let order of orders"
         class="glass-card rounded-2xl p-6 hover:-translate-y-1 transition-all duration-200 cursor-pointer group flex flex-col h-full">

      <!-- Header -->
      <div class="flex items-start justify-between mb-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
               style="background:hsl(var(--primary)/0.12)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:hsl(var(--primary))">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            </svg>
          </div>
          <div>
            <h3 class="font-bold text-foreground">{{order.ref}}</h3>
            <p class="text-xs text-muted-foreground">{{order.date}}</p>
          </div>
        </div>
        <span class="badge text-[10px]" [ngClass]="{
          'badge-primary': order.status === 'EN FABRICATION' || order.status === 'EN ASSEMBLAGE',
          'badge-accent': order.status === 'EXPEDIEE',
          'badge-success': order.status === 'LIVREE'
        }">{{order.status}}</span>
      </div>

      <!-- Details -->
      <div class="space-y-3 mb-6 flex-1">
        <div class="flex items-center justify-between text-sm">
          <span class="text-muted-foreground">Type de service</span>
          <span class="font-medium text-foreground">PCBA Premium</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-muted-foreground">Quantité</span>
          <span class="font-medium text-foreground">500 unités</span>
        </div>
        <div class="flex items-center justify-between text-sm pt-3 border-t border-border/50">
          <span class="text-muted-foreground">Revenu total</span>
          <span class="font-bold text-lg" style="color:hsl(var(--primary))">{{order.amount}} TND</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-2 mt-auto">
        <a [routerLink]="['/client/order', order.ref]" class="btn-primary flex-1 py-2 text-xs">
          Voir les détails
        </a>
        <button class="btn-icon w-10 h-10 shrink-0" title="Télécharger la facture">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="21 15 16 10 5 21"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

</div>
