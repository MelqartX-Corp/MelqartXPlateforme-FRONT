<div class="space-y-8 animate-fade-up">

  <!-- ═══ CLIENT "WOW" HERO HEADER ═══ -->
  <div class="client-header-hero">
    <div class="relative z-10 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-5">
      <div class="client-header-icon-box">
        📝
      </div>
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="client-header-tag">
            <span class="client-header-tag-dot"></span>
            Espace Chiffrage
          </span>
        </div>
        <h1 class="client-header-title">
          Mes Devis
        </h1>
        <p class="text-xs text-muted-foreground font-medium">
          Historique et statut de vos demandes de chiffrage technique et commercial.
        </p>
      </div>
    </div>
    <a routerLink="/client/new-quote" class="client-header-btn-primary self-start md:self-center z-10 cursor-pointer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      <span>Nouveau devis</span>
    </a>
  </div>

  <!-- Filters -->
  <div class="glass-card rounded-2xl p-4 flex flex-wrap items-center gap-4">
    <div class="flex items-center gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase tracking-wide">Type</label>
      <select class="input-base w-36" [(ngModel)]="filterType">
        <option value="all">Tous</option>
        <option value="PCB">PCB</option>
        <option value="PCBA">PCBA</option>
      </select>
    </div>
    <div class="flex items-center gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase tracking-wide">Statut</label>
      <select class="input-base w-40" [(ngModel)]="filterStatus">
        <option value="all">Tous</option>
        <option value="SOUMIS">Soumis</option>
        <option value="VALIDE">Validé</option>
        <option value="BROUILLON">Brouillon</option>
        <option value="EXPIRE">Expiré</option>
        <option value="ANNULE">Annulé</option>
      </select>
    </div>
    <span class="ml-auto badge-muted">{{filteredQuotes.length}} résultat(s)</span>
  </div>

  <!-- Table -->
  <div class="glass-card rounded-2xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full data-table">
        <thead>
          <tr class="border-b border-border/50 bg-secondary/20">
            <th>Référence</th><th>Type</th><th>Date</th><th>Statut</th><th>Montant</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let quote of filteredQuotes" class="group">
            <td><span class="font-semibold text-foreground">{{quote.ref}}</span></td>
            <td><span class="badge-accent text-[10px]">{{quote.type}}</span></td>
            <td class="text-muted-foreground text-xs">{{quote.date}}</td>
            <td>
              <span class="badge text-[10px]" [ngClass]="{
                'badge-warning':    quote.status==='SOUMIS'||quote.status==='BROUILLON',
                'badge-success':    quote.status==='VALIDE',
                'badge-destructive':quote.status==='EXPIRE'||quote.status==='ANNULE'
              }">{{quote.status}}</span>
            </td>
            <td><span class="font-bold" style="color:hsl(var(--primary))">{{quote.amount}} TND</span></td>
            <td>
              <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-all duration-200">
                <button class="btn-icon w-8 h-8" title="Détails" style="color:hsl(var(--muted-foreground))">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
